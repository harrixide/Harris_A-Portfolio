<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" role="img" aria-labelledby="title desc">
  <title id="title">Full Recommender title mark</title>
  <desc id="desc">A compact teal, magenta, red, and black title graphic reading Full Recommender with the subtitle No Song Audio.</desc>
  <defs>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ruleGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00b8a9"/>
      <stop offset="0.52" stop-color="#ff2ea6"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>
    <pattern id="microGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#00b8a9" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <radialGradient id="ambientTeal" cx="58%" cy="38%" r="54%">
      <stop offset="0" stop-color="#00b8a9" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#00b8a9" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#00b8a9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientMagenta" cx="82%" cy="62%" r="42%">
      <stop offset="0" stop-color="#ff2ea6" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ff2ea6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff2ea6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="840" height="190" fill="url(#ambientTeal)"/>
  <rect width="840" height="190" fill="url(#ambientMagenta)"/>
  <rect x="0" y="6" width="840" height="178" fill="url(#microGrid)" opacity="0.22"/>

  <g opacity="0.8" fill="none" stroke-linecap="square">
    <path d="M36 151 C146 84, 218 156, 320 91 S504 75, 610 127 S748 83, 802 109" stroke="#00b8a9" stroke-opacity="0.35" stroke-width="1.4"/>
    <path d="M80 132 C170 88, 248 131, 344 103 S504 91, 590 132 S720 106, 780 82" stroke="#ff2ea6" stroke-opacity="0.26" stroke-width="1.2"/>
    <path d="M532 39 A86 86 0 0 1 730 122" stroke="#f2eee7" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M568 54 A58 58 0 0 1 708 116" stroke="#ff3b30" stroke-opacity="0.33" stroke-width="1.4"/>
  </g>

  <g fill="#00b8a9" opacity="0.65">
    <circle cx="604" cy="118" r="3.5"/>
    <circle cx="640" cy="84" r="2.5"/>
    <circle cx="690" cy="112" r="3"/>
    <circle cx="754" cy="77" r="2"/>
    <circle cx="780" cy="130" r="2.5"/>
  </g>
  <g fill="#ff2ea6" opacity="0.58">
    <circle cx="552" cy="108" r="2.5"/>
    <circle cx="676" cy="145" r="3"/>
    <circle cx="730" cy="96" r="2"/>
    <circle cx="792" cy="104" r="3.5"/>
  </g>
  <g fill="#ff3b30" opacity="0.72">
    <rect x="705" y="138" width="8" height="8"/>
    <rect x="762" y="52" width="6" height="6"/>
  </g>

  <path d="M36 144H446" stroke="url(#ruleGradient)" stroke-width="4"/>
  <path d="M36 43H112" stroke="#ff3b30" stroke-width="5"/>
  <path d="M116 43H802" stroke="#f2eee7" stroke-opacity="0.18" stroke-width="1"/>

  <text x="34" y="92" fill="#f2eee7" font-family="Courier" font-size="56" font-weight="700" letter-spacing="0" filter="url(#softGlow)">Full Recommender</text>
  <text x="38" y="126" fill="#00b8a9" font-family="Courier" font-size="18" font-weight="700" letter-spacing="0">NO SONG AUDIO</text>
  <text x="568" y="37" fill="#ff2ea6" font-family="Courier" font-size="13" font-weight="700" letter-spacing="0" filter="url(#softGlow)">8K+ CATALOG</text>
  <text x="648" y="160" fill="#f2eee7" fill-opacity="0.58" font-family="Courier" font-size="12" font-weight="400" letter-spacing="0">similarity / uniqueness / journey</text>
</svg>
