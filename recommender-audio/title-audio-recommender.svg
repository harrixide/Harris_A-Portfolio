<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" role="img" aria-labelledby="title desc">
  <title id="title">Smaller Recommender with Song Audio title mark</title>
  <desc id="desc">A compact teal, magenta, red, and black title graphic reading Smaller Recommender with Song Audio.</desc>
  <defs>
    <filter id="pulseGlow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="audioRule" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00b8a9"/>
      <stop offset="0.45" stop-color="#ff2ea6"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>
    <pattern id="dotField" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#f2eee7" fill-opacity="0.14"/>
    </pattern>
    <radialGradient id="ambientAudioTeal" cx="66%" cy="42%" r="54%">
      <stop offset="0" stop-color="#00b8a9" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#00b8a9" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#00b8a9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientAudioRed" cx="80%" cy="66%" r="44%">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.22"/>
      <stop offset="0.56" stop-color="#ff3b30" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="840" height="190" fill="url(#ambientAudioTeal)"/>
  <rect width="840" height="190" fill="url(#ambientAudioRed)"/>
  <rect x="0" y="0" width="840" height="190" fill="url(#dotField)" opacity="0.24"/>

  <g transform="translate(552 30)" fill="none" stroke-linecap="round">
    <path d="M0 62 C18 18, 46 18, 64 62 S110 106, 128 62 S174 18, 192 62" stroke="#00b8a9" stroke-opacity="0.55" stroke-width="2.2"/>
    <path d="M0 62 C18 98, 46 98, 64 62 S110 26, 128 62 S174 98, 192 62" stroke="#ff2ea6" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M-4 62H202" stroke="#f2eee7" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="64" cy="62" r="8" fill="#00b8a9" filter="url(#pulseGlow)"/>
    <circle cx="128" cy="62" r="8" fill="#ff2ea6" filter="url(#pulseGlow)"/>
    <circle cx="192" cy="62" r="8" fill="#ff3b30" filter="url(#pulseGlow)"/>
  </g>

  <g opacity="0.76">
    <path d="M40 129 C116 103, 174 122, 230 104 S338 80, 414 116 S514 142, 570 122" fill="none" stroke="#00b8a9" stroke-opacity="0.28" stroke-width="1.5"/>
    <path d="M40 119 C116 96, 180 142, 242 116 S360 82, 430 126 S526 146, 586 105" fill="none" stroke="#ff2ea6" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>

  <path d="M36 144H528" stroke="url(#audioRule)" stroke-width="4"/>
  <path d="M36 43H96" stroke="#00b8a9" stroke-width="5"/>
  <path d="M100 43H802" stroke="#f2eee7" stroke-opacity="0.18" stroke-width="1"/>

  <text x="34" y="88" fill="#f2eee7" font-family="Courier" font-size="47" font-weight="700" letter-spacing="0" filter="url(#pulseGlow)">Smaller Recommender</text>
  <text x="38" y="123" fill="#00b8a9" font-family="Courier" font-size="19" font-weight="700" letter-spacing="0">WITH SONG AUDIO</text>
  <text x="602" y="142" fill="#ff3b30" font-family="Courier" font-size="13" font-weight="700" letter-spacing="0" filter="url(#pulseGlow)">PLAYABLE SUBSET</text>
  <text x="38" y="169" fill="#f2eee7" fill-opacity="0.58" font-family="Courier" font-size="12" font-weight="400" letter-spacing="0">compare tracks / seek / speed / listen side by side</text>
</svg>
